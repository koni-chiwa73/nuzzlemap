<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Interactive Map | NuzzleMap</title>

    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <!-- Το CSS του Leaflet ΠΡΙΝ από το δικό μας, ώστε να μπορούμε να το παρακάμψουμε -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <link rel="stylesheet" href="css/base.css"/>
    <link rel="stylesheet" href="css/gallery.css"/>
    <link rel="stylesheet" href="css/map.css"/>

    <script defer
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
  </head>

  <body data-page="map">
    <main>
      <section class="hero hero--compact">
        <h1>Find places for pets <span class="accent">across Greece</span></h1>
        <p class="hero-text">
          Animal welfare organisations, shelters, pet shops and pet-friendly places on one map.
        </p>

        <div class="toolbar">
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <label for="search" class="visually-hidden">Search places</label>
            <input type="search" id="search" class="control" placeholder="Search by name, city or address"/>
          </div>

          <label for="filter-category" class="visually-hidden">Filter by category</label>
          <select id="filter-category" class="control">
            <option value="">All categories</option>
          </select>

          <label for="filter-region" class="visually-hidden">Filter by region</label>
          <select id="filter-region" class="control">
            <option value="">All regions</option>
          </select>

          <p id="count" class="count" aria-live="polite"></p>
        </div>

        <p class="map-note">These places are sample entries used while we build the map.</p>
      </section>

      <div class="map-layout">
        <aside class="places-panel" aria-label="List of places">
          <ul id="places-list" class="places-list"></ul>
        </aside>

        <div class="map-wrap">
          <div id="map" role="region" aria-label="Map of places for pets in Greece"></div>
        </div>
      </div>
    </main>

    <div id="loader" class="loader-container" role="status">
      <p>Loading the map...</p>
      <div class="spinner"></div>
    </div>

    <script type="module" src="script/layout.js"></script>
    <script type="module" src="script/map.js"></script>
  </body>
</html>
